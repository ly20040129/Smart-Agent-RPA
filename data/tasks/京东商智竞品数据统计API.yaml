name: 京东商智竞品数据统计(API)
description: 通过API接口获取京东商智竞品统计数据，匹配Excel模板后保存
mode: api
department: operations
enabled: true
schedule: ''

params_input:
  - key: date_str
    label: 查询日期
    type: date
    required: true
  - key: output_dir
    label: 保存位置
    type: path
    required: true
  - key: excel_path
    label: 上传模板
    type: file
    required: true
    help: 每日9730销量统计表模板

steps:
  - type: api
    action: run_workflow
    description: 调用京东API获取商智竞品数据并写入Excel
    params:
      module: workflows.jd_shangzhi_jingp_data
      function: process
