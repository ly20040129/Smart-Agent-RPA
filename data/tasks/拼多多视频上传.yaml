name: 拼多多视频上传
description: 上传视频到拼多多创作者平台，自动发布并关联商品
mode: browser
department: operations
enabled: true
schedule: ''

params_input:
  - key: video_file
    label: 视频文件
    type: file
    required: true
    help: 选择要上传的视频文件（MP4格式）
  - key: desc
    label: 视频描述
    type: text
    required: true
    help: 视频的描述文字
  - key: goods_id
    label: 商品ID
    type: text
    required: true
    help: 拼多多商品ID（数字）

steps:
  - type: browser
    action: run_workflow
    description: 上传视频到拼多多并发布
    params:
      module: workflows.pdd_upload
      function: run
