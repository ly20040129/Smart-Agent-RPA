# ================================================================
# 配置项定义（管理员维护）
# ================================================================
# 这个文件定义了"同事能在网页上配置哪些东西"。
# 管理员在这里加一个配置项，同事刷新Web页面就能看到并填写。
#
# 每个配置项的字段：
#   label:    显示给同事看的名称（中文）
#   type:     file=可上传文件 / path=本地路径 / text=文本
#   required: 是否必填
#   help:     给同事的提示说明
#   default:  默认值（同事没填时用这个）
#   accept:   type=file时，限制文件类型（如 .xlsx,.xls）
# ================================================================

groups:
  # ====== 模板文件 ======
  - name: templates
    label: 📋 Excel模板文件
    items:
      # 财务部门模板
      - key: templates.finance.wechat_bill_template
        label: 微信公众号账单模板
        type: file
        accept: .xlsx,.xls
        required: false
        help: 用于微信公众号资金账单的Excel模板（可以上传或填本地路径）
        default: ""

      - key: templates.finance.jd_sales_template
        label: 京东销售出库报表模板
        type: file
        accept: .xlsx,.xls
        required: false
        help: 京东销售出库报表的Excel模板
        default: ""

      - key: templates.finance.tmall_stock_template
        label: 天猫保税仓库存模板
        type: file
        accept: .xlsx,.xls
        required: false
        help: 天猫保税仓库存/出库的Excel模板
        default: ""

      # 业务部门模板
      - key: templates.business.daily_report_template
        label: 业务日报模板
        type: file
        accept: .xlsx,.xls
        required: false
        help: 业务部门日报Excel模板
        default: ""

  # ====== 目录配置 ======
  - name: dirs
    label: 📁 本地目录配置
    items:
      - key: download_dirs.default
        label: 默认下载目录
        type: path
        required: false
        help: 浏览器下载的文件默认保存到这里
        default: "data/downloads"

      - key: download_dirs.wechat
        label: 微信下载目录
        type: path
        required: false
        help: 微信任务下载文件保存目录
        default: "data/downloads/wechat"

      - key: download_dirs.jd
        label: 京东下载目录
        type: path
        required: false
        help: 京东任务下载文件保存目录
        default: "data/downloads/jd"

      - key: output_dir
        label: 数据输出目录
        type: path
        required: false
        help: 处理后的Excel/CSV保存目录
        default: "data/output"

      - key: chart_dir
        label: 图表输出目录
        type: path
        required: false
        help: 生成的图表PNG保存目录
        default: "local_output/charts"

  # ====== 其他本地文件 ======
  - name: misc
    label: 🔧 其他本地文件
    items:
      - key: local_files.private_key
        label: 私钥文件路径（可选）
        type: path
        required: false
        help: 如果任务需要用到本地私钥文件，填写路径
        default: ""

      - key: local_files.config_json
        label: 本地配置JSON（可选）
        type: file
        accept: .json
        required: false
        help: 某些特殊任务需要的本地JSON配置文件
        default: ""
